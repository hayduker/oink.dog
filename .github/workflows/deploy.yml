name: Deploy Website and Compile Resume

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggers from the GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Install and compile Typst
      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile Resume
        run: typst compile resume.typ resume.pdf

      # 2. Upload the workspace as an artifact (contains index.html + the new resume.pdf)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Upload the root directory

      # 3. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4